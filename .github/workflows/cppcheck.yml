name: cppcheck

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update --fix-missing -y
          sudo apt-get install -y cppcheck libglib2.0-dev-bin

      - name: Generate cups-notifier sources
        run: |
          cd cups-proxyd
          gdbus-codegen \
            --interface-prefix org.cups.cupsd \
            --c-namespace Cups \
            --generate-c-code cups-notifier \
            org.cups.cupsd.Notifier.xml

      - name: Run cppcheck
        run: |
          # cppcheck does not read the system's GLib headers, and VERSION
          # comes from the Makefile.  Without these definitions cppcheck 2.19
          # fails on "#if GLIB_CHECK_VERSION(...)" in cups-notifier.h, and
          # the unknown macros make it skip cups-proxyd.c altogether.
          printf '#define GLIB_CHECK_VERSION(major, minor, micro) 1\n#define VERSION "1.0"\n' > "$RUNNER_TEMP/cppcheck-defines.h"
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --library=gtk \
            --include="$RUNNER_TEMP/cppcheck-defines.h" \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            .

